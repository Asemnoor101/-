name: Download and trim adhkar audio

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/trim-audio.yml"
      - "audio/sources.txt"

permissions:
  contents: write

jobs:
  trim:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: Download, remove silence, compress
        run: |
          set -e
          mkdir -p audio raw
          echo "file | before (s) | after (s)" > audio/durations.txt
          # each line: output-name|url1|url2|...
          grep -v '^#' audio/sources.txt | grep -v '^$' | while IFS='|' read -r name urls; do
            ok=""
            IFS='|' read -ra list <<< "$urls"
            for u in "${list[@]}"; do
              if curl -fsSL --retry 3 --max-time 300 -o "raw/$name.mp3" "$u" </dev/null; then ok=1; break; fi
              echo "failed: $u"
            done
            [ -z "$ok" ] && { echo "SKIP $name"; continue; }
            # remove leading silence, shorten every pause longer than 0.4s to 0.15s, mono 64k
            ffmpeg -nostdin -hide_banner -loglevel error -y -i "raw/$name.mp3" \
              -af "silenceremove=start_periods=1:start_threshold=-30dB:start_silence=0.05:stop_periods=-1:stop_duration=0.4:stop_silence=0.15:stop_threshold=-30dB" \
              -ac 1 -ar 44100 -b:a 64k -map_metadata -1 "audio/$name.mp3"
            b=$(ffprobe -v error -show_entries format=duration -of csv=p=0 "raw/$name.mp3")
            a=$(ffprobe -v error -show_entries format=duration -of csv=p=0 "audio/$name.mp3")
            echo "$name | ${b%.*} | ${a%.*}" | tee -a audio/durations.txt
          done

      - name: Commit trimmed files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898+github-actions[bot]@users.noreply.github.com"
          git add audio/*.mp3 audio/durations.txt
          git commit -m "Add trimmed adhkar audio" || echo "nothing to commit"
          git push
