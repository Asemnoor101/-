<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="أذكاري">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#141a2b">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<title>أذكار السيارة</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap">
<style>
/* Layout: one column; a sticky player on top, dhikr cards below with tap-to-count. Palette follows the time: dawn sand for morning, dusk indigo for evening. */
:root{
  --bg:#f6f1e7; --surface:#fffdf8; --fg:#2b2418; --muted:#7a6d58; --line:#e6dccb;
  --accent:#b3741f; --accent-ink:#fff8ec; --done:#3f7a55;
  --display:"Amiri","Noto Naskh Arabic","Geeza Pro",serif;
  --ui:"IBM Plex Sans Arabic","SF Arabic","Geeza Pro",system-ui,sans-serif;
  color-scheme:light;
}
body.evening{
  --bg:#141a2b; --surface:#1c2439; --fg:#ece7da; --muted:#9aa3b8; --line:#2c3652;
  --accent:#d9a648; --accent-ink:#141a2b; --done:#7fc49a;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--ui);font-size:16px;line-height:1.6;
  padding:env(safe-area-inset-top,0) 16px calc(env(safe-area-inset-bottom,0) + 32px);transition:background .4s,color .4s}
.wrap{max-width:640px;margin:0 auto}
header{padding-block:20px 8px;display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
h1{font-family:var(--display);font-size:2rem;margin:0;line-height:1.2}
.when{color:var(--muted);font-size:.85rem;font-variant-numeric:tabular-nums}
.tabs{display:flex;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px}
.tabs button{flex:1;border:0;background:transparent;color:var(--muted);font:500 .95rem var(--ui);padding:8px 14px;border-radius:999px;cursor:pointer}
.tabs button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.player{position:sticky;top:env(safe-area-inset-top,0);z-index:5;background:var(--bg);padding-block:12px;display:grid;gap:12px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.play{width:64px;height:64px;border-radius:50%;border:0;background:var(--accent);color:var(--accent-ink);font-size:1.6rem;cursor:pointer;flex:none;display:grid;place-items:center}
.play:focus-visible,.tabs button:focus-visible,select:focus-visible,.card:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.track{flex:1;min-width:0;display:grid;gap:4px}
.track .name{font-weight:600}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;cursor:pointer}
.bar span{display:block;height:100%;width:0;background:var(--accent)}
.time{font-size:.8rem;color:var(--muted);font-variant-numeric:tabular-nums;display:flex;justify-content:space-between}
label{font-size:.8rem;color:var(--muted);display:grid;gap:2px;flex:1;min-width:130px}
select{font:500 1rem var(--ui);padding:8px 10px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--fg)}
.status{font-size:.85rem;color:var(--muted);min-height:1.2em}
.list{display:grid;gap:12px;margin-top:8px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;cursor:pointer;user-select:none;-webkit-user-select:none}
.card p{font-family:var(--display);font-size:1.35rem;line-height:2;margin:0 0 10px}
.card .meta{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:.8rem;color:var(--muted)}
.count{font:600 .95rem var(--ui);font-variant-numeric:tabular-nums;border:1px solid var(--accent);color:var(--accent);border-radius:999px;padding:2px 12px;min-width:3.2em;text-align:center}
.card.done{opacity:.55}
.card.done .count{border-color:var(--done);color:var(--done)}
header{flex-wrap:wrap}
.head-main{min-width:0}
.today{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.chip{font-size:.75rem;padding:2px 10px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
.chip.ok{border-color:var(--done);color:var(--done)}
.chip.ok::before{content:"✓ "}
.streak{font-size:.75rem;color:var(--accent);font-weight:600}
.link{background:none;border:0;padding:0;color:var(--accent);font:500 .85rem var(--ui);text-decoration:underline;cursor:pointer}
.banner{margin-block:10px;padding:12px 14px;border-radius:12px;border:1px solid var(--done);color:var(--done);display:flex;flex-wrap:wrap;gap:8px 14px;justify-content:space-between;align-items:center;font-weight:500}
.resume{font-size:.85rem;color:var(--muted)}
.extras h2{font-family:var(--display);font-size:1.4rem;margin:16px 0 8px}
.note{font-size:.8rem;color:var(--muted);margin:4px 0 0}
.card.now{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent) inset;opacity:1}
.card.now p{color:var(--fg)}
.meta-r{display:flex;gap:8px;align-items:center}
.seek{background:none;border:1px solid var(--line);color:var(--muted);border-radius:999px;font:500 .75rem var(--ui);padding:3px 10px;cursor:pointer}
.seek:focus-visible,.link:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.reset{background:none;border:0;color:var(--muted);font:500 .85rem var(--ui);text-decoration:underline;cursor:pointer;padding:8px 0}
@media (prefers-reduced-motion:reduce){body{transition:none}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="head-main">
      <h1 id="title">أذكار الصباح</h1>
      <div class="when"><span id="times"></span> <button class="link" id="locate" type="button">موقعي</button></div>
    </div>
    <div class="today" aria-label="إنجاز اليوم">
      <span class="chip" id="chip-m">الصباح</span>
      <span class="chip" id="chip-e">المساء</span>
      <span class="streak" id="streak"></span>
    </div>
  </header>

  <div class="banner" id="doneBanner" hidden>
    <span id="doneText"></span>
    <button class="link" id="again" type="button">تشغيل مرة ثانية</button>
  </div>

  <div class="tabs" role="group" aria-label="نوع الأذكار">
    <button id="tab-morning" aria-pressed="true">الصباح</button>
    <button id="tab-evening" aria-pressed="false">المساء</button>
  </div>

  <section class="player" id="player" aria-label="المشغل">
    <div class="row">
      <button class="play" id="play" aria-label="تشغيل">▶</button>
      <div class="track">
        <div class="name" id="trackName"></div>
        <div class="bar" id="bar"><span id="fill"></span></div>
        <div class="time"><span id="cur">0:00</span><span id="dur">--:--</span></div>
      </div>
    </div>
    <div class="row">
      <label for="reciter">القارئ
        <select id="reciter"></select>
      </label>
      <label for="speed">السرعة
        <select id="speed">
          <option value="0.75">0.75×</option>
          <option value="1">1×</option>
          <option value="1.25">1.25×</option>
          <option value="1.5">1.5×</option>
          <option value="1.75">1.75×</option>
          <option value="2">2×</option>
        </select>
      </label>
    </div>
    <div class="status" id="status"></div>
    <div class="resume" id="resume" hidden>كمّلنا من حيث وقفت · <button class="link" id="fromStart" type="button">ابدأ من البداية</button></div>
  </section>

  <section class="extras" id="extras" hidden>
    <h2>أذكار للطريق</h2>
    <div class="list" id="extrasList"></div>
  </section>

  <p class="note" id="listNote"></p>
  <div class="list" id="list"></div>
  <button class="reset" id="reset">تصفير العدّادات</button>
</div>

<audio id="audio" preload="auto" playsinline></audio>

<script>
// ---- Audio sources (Internet Archive, via makkahlive.net collection) ----
// Each track: trimmed copy in this site first (silence removed), then archive.org backups.
const TV = n => ["https://ia801403.us.archive.org/1/items/TvQuran.com__Athkar/TvQuran.com_athkar_"+n+".mp3",
                 "https://ia601602.us.archive.org/0/items/makkah-live.-net-athkar-01/MakkahLive.Net_athkar_"+n+".mp3"];
const LB = "https://ia800101.us.archive.org/25/items/AthkarAlm2472472472472474aaFaisalLabban/";
const AB = "https://ia601409.us.archive.org/17/items/Athka247424724724475dreesAbkar/Athkar%20Idrees%20Abkar.mp3";
const RF = "https://ia902800.us.archive.org/19/items/AthkarHaniAlr247472472424242472efaei/Athkar%20Hani%20Alrefaei.mp3";
const RECITERS = {
  afasy:  {name:"مشاري العفاسي", morning:["audio/afasy-morning.mp3",...TV("03")], evening:["audio/afasy-evening.mp3",...TV("04")]},
  abbad:  {name:"فارس عباد",     morning:["audio/abbad-morning.mp3",...TV("05")], evening:["audio/abbad-evening.mp3",...TV("06")]},
  jibril: {name:"محمد جبريل",    morning:["audio/jibril-morning.mp3",...TV("07")], evening:["audio/jibril-evening.mp3",...TV("08")]},
  labban: {name:"فيصل لبان",     morning:["audio/labban-morning.mp3", LB+"Athkar%20Alsabah%20-%20Faisal%20Labban.mp3"],
                                 evening:["audio/labban-evening.mp3", LB+"Athkar%20Almasaa%20-%20Faisal%20Labban.mp3"]},
  abkar:  {name:"إدريس أبكر (صباح ومساء معاً)", morning:["audio/abkar-both.mp3", AB], evening:["audio/abkar-both.mp3", AB]},
  rifai:  {name:"هاني الرفاعي (صباح ومساء معاً)", morning:["audio/rifai-both.mp3", RF], evening:["audio/rifai-both.mp3", RF]}
};
let mirrorIdx = 0;
const urls = () => RECITERS[reciter][period];

// ---- Adhkar text (حصن المسلم) ; m = morning wording, e = evening wording ----
const ADHKAR = [
 {t:"أعوذ بالله من الشيطان الرجيم\nاللَّهُ لَا إِلَٰهَ إِلَّا هُوَ الْحَيُّ الْقَيُّومُ ۚ لَا تَأْخُذُهُ سِنَةٌ وَلَا نَوْمٌ ۚ لَّهُ مَا فِي السَّمَاوَاتِ وَمَا فِي الْأَرْضِ ۗ مَن ذَا الَّذِي يَشْفَعُ عِندَهُ إِلَّا بِإِذْنِهِ ۚ يَعْلَمُ مَا بَيْنَ أَيْدِيهِمْ وَمَا خَلْفَهُمْ ۖ وَلَا يُحِيطُونَ بِشَيْءٍ مِّنْ عِلْمِهِ إِلَّا بِمَا شَاءَ ۚ وَسِعَ كُرْسِيُّهُ السَّمَاوَاتِ وَالْأَرْضَ ۖ وَلَا يَئُودُهُ حِفْظُهُمَا ۚ وَهُوَ الْعَلِيُّ الْعَظِيمُ", n:1, src:"آية الكرسي"},
 {t:"بسم الله الرحمن الرحيم\nقُلْ هُوَ اللَّهُ أَحَدٌ ۝ اللَّهُ الصَّمَدُ ۝ لَمْ يَلِدْ وَلَمْ يُولَدْ ۝ وَلَمْ يَكُن لَّهُ كُفُوًا أَحَدٌ", n:3, src:"سورة الإخلاص"},
 {t:"بسم الله الرحمن الرحيم\nقُلْ أَعُوذُ بِرَبِّ الْفَلَقِ ۝ مِن شَرِّ مَا خَلَقَ ۝ وَمِن شَرِّ غَاسِقٍ إِذَا وَقَبَ ۝ وَمِن شَرِّ النَّفَّاثَاتِ فِي الْعُقَدِ ۝ وَمِن شَرِّ حَاسِدٍ إِذَا حَسَدَ", n:3, src:"سورة الفلق"},
 {t:"بسم الله الرحمن الرحيم\nقُلْ أَعُوذُ بِرَبِّ النَّاسِ ۝ مَلِكِ النَّاسِ ۝ إِلَٰهِ النَّاسِ ۝ مِن شَرِّ الْوَسْوَاسِ الْخَنَّاسِ ۝ الَّذِي يُوَسْوِسُ فِي صُدُورِ النَّاسِ ۝ مِنَ الْجِنَّةِ وَالنَّاسِ", n:3, src:"سورة الناس"},
 {m:"أَصْبَحْنَا وَأَصْبَحَ الْمُلْكُ لِلَّهِ، وَالْحَمْدُ لِلَّهِ، لَا إِلَهَ إِلَّا اللهُ وَحْدَهُ لَا شَرِيكَ لَهُ، لَهُ الْمُلْكُ وَلَهُ الْحَمْدُ وَهُوَ عَلَى كُلِّ شَيْءٍ قَدِيرٌ، رَبِّ أَسْأَلُكَ خَيْرَ مَا فِي هَذَا الْيَوْمِ وَخَيْرَ مَا بَعْدَهُ، وَأَعُوذُ بِكَ مِنْ شَرِّ مَا فِي هَذَا الْيَوْمِ وَشَرِّ مَا بَعْدَهُ، رَبِّ أَعُوذُ بِكَ مِنَ الْكَسَلِ وَسُوءِ الْكِبَرِ، رَبِّ أَعُوذُ بِكَ مِنْ عَذَابٍ فِي النَّارِ وَعَذَابٍ فِي الْقَبْرِ",
  e:"أَمْسَيْنَا وَأَمْسَى الْمُلْكُ لِلَّهِ، وَالْحَمْدُ لِلَّهِ، لَا إِلَهَ إِلَّا اللهُ وَحْدَهُ لَا شَرِيكَ لَهُ، لَهُ الْمُلْكُ وَلَهُ الْحَمْدُ وَهُوَ عَلَى كُلِّ شَيْءٍ قَدِيرٌ، رَبِّ أَسْأَلُكَ خَيْرَ مَا فِي هَذِهِ اللَّيْلَةِ وَخَيْرَ مَا بَعْدَهَا، وَأَعُوذُ بِكَ مِنْ شَرِّ مَا فِي هَذِهِ اللَّيْلَةِ وَشَرِّ مَا بَعْدَهَا، رَبِّ أَعُوذُ بِكَ مِنَ الْكَسَلِ وَسُوءِ الْكِبَرِ، رَبِّ أَعُوذُ بِكَ مِنْ عَذَابٍ فِي النَّارِ وَعَذَابٍ فِي الْقَبْرِ", n:1},
 {m:"اللَّهُمَّ بِكَ أَصْبَحْنَا، وَبِكَ أَمْسَيْنَا، وَبِكَ نَحْيَا، وَبِكَ نَمُوتُ، وَإِلَيْكَ النُّشُورُ",
  e:"اللَّهُمَّ بِكَ أَمْسَيْنَا، وَبِكَ أَصْبَحْنَا، وَبِكَ نَحْيَا، وَبِكَ نَمُوتُ، وَإِلَيْكَ الْمَصِيرُ", n:1},
 {t:"اللَّهُمَّ أَنْتَ رَبِّي لَا إِلَهَ إِلَّا أَنْتَ، خَلَقْتَنِي وَأَنَا عَبْدُكَ، وَأَنَا عَلَى عَهْدِكَ وَوَعْدِكَ مَا اسْتَطَعْتُ، أَعُوذُ بِكَ مِنْ شَرِّ مَا صَنَعْتُ، أَبُوءُ لَكَ بِنِعْمَتِكَ عَلَيَّ، وَأَبُوءُ بِذَنْبِي فَاغْفِرْ لِي فَإِنَّهُ لَا يَغْفِرُ الذُّنُوبَ إِلَّا أَنْتَ", n:1, src:"سيد الاستغفار"},
 {m:"اللَّهُمَّ إِنِّي أَصْبَحْتُ أُشْهِدُكَ، وَأُشْهِدُ حَمَلَةَ عَرْشِكَ، وَمَلَائِكَتَكَ، وَجَمِيعَ خَلْقِكَ، أَنَّكَ أَنْتَ اللهُ لَا إِلَهَ إِلَّا أَنْتَ وَحْدَكَ لَا شَرِيكَ لَكَ، وَأَنَّ مُحَمَّدًا عَبْدُكَ وَرَسُولُكَ",
  e:"اللَّهُمَّ إِنِّي أَمْسَيْتُ أُشْهِدُكَ، وَأُشْهِدُ حَمَلَةَ عَرْشِكَ، وَمَلَائِكَتَكَ، وَجَمِيعَ خَلْقِكَ، أَنَّكَ أَنْتَ اللهُ لَا إِلَهَ إِلَّا أَنْتَ وَحْدَكَ لَا شَرِيكَ لَكَ، وَأَنَّ مُحَمَّدًا عَبْدُكَ وَرَسُولُكَ", n:4},
 {m:"اللَّهُمَّ مَا أَصْبَحَ بِي مِنْ نِعْمَةٍ أَوْ بِأَحَدٍ مِنْ خَلْقِكَ فَمِنْكَ وَحْدَكَ لَا شَرِيكَ لَكَ، فَلَكَ الْحَمْدُ وَلَكَ الشُّكْرُ",
  e:"اللَّهُمَّ مَا أَمْسَى بِي مِنْ نِعْمَةٍ أَوْ بِأَحَدٍ مِنْ خَلْقِكَ فَمِنْكَ وَحْدَكَ لَا شَرِيكَ لَكَ، فَلَكَ الْحَمْدُ وَلَكَ الشُّكْرُ", n:1},

// ---- Prayer times (Umm al-Qura method: Fajr 18.5°, Asr = shadow 1). Computed on the phone, no internet. ----
const CITY_DEFAULT = {name:"جدة", lat:21.5433, lng:39.1728};
const TZ = 3; // Saudi Arabia, no daylight saving
const rad = d => d*Math.PI/180, deg = r => r*180/Math.PI;
const fixH = h => ((h%24)+24)%24;
function sunPos(jd){
  const d = jd - 2451545.0;
  const g = rad((357.529 + 0.98560028*d) % 360);
  const q = (280.459 + 0.98564736*d) % 360;
  const L = rad((q + 1.915*Math.sin(g) + 0.020*Math.sin(2*g)) % 360);
  const e = rad(23.439 - 0.00000036*d);
  const RA = fixH(deg(Math.atan2(Math.cos(e)*Math.sin(L), Math.cos(L)))/15);
  return {dec: Math.asin(Math.sin(e)*Math.sin(L)), eqt: q/15 - RA};
}
function prayerTimes(date, lat, lng){
  // date = a Date for the Saudi calendar day; returns hours (decimal, Saudi time)
  const y=date.y, m=date.m, dd=date.d;
  const A=Math.floor((14-m)/12), Y=y+4800-A, M=m+12*A-3;
  const jd = dd + Math.floor((153*M+2)/5) + 365*Y + Math.floor(Y/4) - Math.floor(Y/100) + Math.floor(Y/400) - 32045 - lng/360;
  const {dec, eqt} = sunPos(jd);
  let eq = eqt; if(eq>12) eq-=24; if(eq<-12) eq+=24;
  const noon = 12 + TZ - lng/15 - eq;
  const phi = rad(lat);
  const T = a => deg(Math.acos((-Math.sin(rad(a)) - Math.sin(dec)*Math.sin(phi)) / (Math.cos(dec)*Math.cos(phi))))/15;
  const asrAlt = Math.atan(1/(1+Math.tan(Math.abs(phi-dec))));
  const asr = deg(Math.acos((Math.sin(asrAlt) - Math.sin(dec)*Math.sin(phi)) / (Math.cos(dec)*Math.cos(phi))))/15;
  return {fajr: noon - T(18.5), dhuhr: noon + 2/60, asr: noon + asr};
}

// Saudi local date/time pieces
function saNow(){
  const parts = Object.fromEntries(new Intl.DateTimeFormat("en-GB",{timeZone:"Asia/Riyadh",year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit",second:"2-digit",hour12:false})
    .formatToParts(new Date()).map(p=>[p.type,p.value]));
  return {y:+parts.year, m:+parts.month, d:+parts.day, h:(+parts.hour%24) + (+parts.minute)/60 + (+parts.second)/3600};
}
const dayStr = o => o.y+"-"+String(o.m).padStart(2,"0")+"-"+String(o.d).padStart(2,"0");
function shiftDay(o, n){ const t=new Date(Date.UTC(o.y,o.m-1,o.d+n)); return {y:t.getUTCFullYear(), m:t.getUTCMonth()+1, d:t.getUTCDate()}; }
function hhmm(h){
  h=fixH(h); let H=Math.floor(h), M=Math.round((h-H)*60); if(M===60){H++;M=0;}
  const ap = H<12 ? "ص" : "م"; const h12 = ((H+11)%12)+1;
  return h12+":"+String(M).padStart(2,"0")+" "+ap;
}

};

// Morning = Fajr → Dhuhr. Evening = Dhuhr → next Fajr (evening after midnight belongs to the previous day).
function currentSlot(){
  const n = saNow(); const t = prayerTimes(n, city.lat, city.lng);
  if(n.h >= t.fajr && n.h < t.dhuhr) return {period:"morning", day:dayStr(n), times:t};
  if(n.h < t.fajr) return {period:"evening", day:dayStr(shiftDay(n,-1)), times:t};
  return {period:"evening", day:dayStr(n), times:t};
}

// ---- completion + streak ----
function markDone(){
  if(isDone(slot.day, period)) return;
  store.set(doneKey(slot.day, period), "1");
  store.del(posKey());
  renderStatus();
}
function streak(){
  // consecutive days with both morning and evening done, counting back from today (today counts only if complete)
  let n=0, d=saNow(); if(!(isDone(dayStr(d),"morning") && isDone(dayStr(d),"evening"))) d=shiftDay(d,-1);
  for(let i=0;i<400;i++){ const k=dayStr(d); if(isDone(k,"morning") && isDone(k,"evening")){ n++; d=shiftDay(d,-1);} else break; }
  return n;
}

function renderStatus(){
  const t = slot.times;
  $("times").textContent = "الفجر "+hhmm(t.fajr)+" · الظهر "+hhmm(t.dhuhr)+" · العصر "+hhmm(t.asr)+" — "+city.name;
  const today = slot.day;
  $("chip-m").classList.toggle("ok", isDone(today,"morning"));
  $("chip-e").classList.toggle("ok", isDone(today,"evening"));
  const s = streak();
  $("streak").textContent = s>0 ? (s===1 ? "يوم كامل" : s===2 ? "يومين متتاليين" : s+" أيام متتالية") : "";
  const done = isDone(slot.day, period) && period===slot.period;
  $("doneBanner").hidden = !done;
  $("extras").hidden = !done;
  if(done) $("doneText").textContent = "أتممت "+(period==="morning"?"أذكار الصباح":"أذكار المساء")+" اليوم، تقبّل الله منك";
}

  $("trackName").textContent = (period==="morning"?"أذكار الصباح":"أذكار المساء")+" — "+RECITERS[reciter].name;
  $("fill").style.width="0"; $("cur").textContent="0:00"; $("dur").textContent="--:--";
  const saved = parseFloat(store.get(posKey(),"0"));
  if(saved > 5) resumeTo = saved;
  renderCards();
  if(wasPlaying) play();
}
let resumeTo = null;

function makeCard(d, i, onSeek){
  const text = d.t || (period==="morning" ? (d.m||d.e) : (d.e||d.m));
  let left = d.n;
  const card=document.createElement("div"); card.className="card"; card.tabIndex=0; card.setAttribute("role","button");
  const p=document.createElement("p"); p.style.whiteSpace="pre-line"; p.textContent=text;
  const meta=document.createElement("div"); meta.className="meta";
  const src=document.createElement("span"); src.textContent = d.src || (d.n>1 ? "اضغط للعدّ" : "");
  const right=document.createElement("span"); right.className="meta-r";
  if(onSeek){
    const go=document.createElement("button"); go.className="seek"; go.type="button"; go.textContent="▶ من هنا";
    go.addEventListener("click",e=>{ e.stopPropagation(); onSeek(); });
    right.append(go);
  }
  const c=document.createElement("span"); c.className="count"; right.append(c);
  const upd=()=>{ c.textContent = left>0 ? left : "✓"; card.classList.toggle("done", left===0);
    card.setAttribute("aria-label", "المتبقي "+left); };
  card.addEventListener("click",()=>{ if(left>0){ left--; upd(); if(navigator.vibrate) navigator.vibrate(15); checkAllCounted(); } });
  card.addEventListener("keydown",e=>{ if(e.key==="Enter"||e.key===" "){ e.preventDefault(); card.click(); } });
  card._reset=()=>{ left=d.n; upd(); };
  card._left=()=>left;
  upd(); meta.append(src,right); card.append(p,meta);
  return card;
}

function checkAllCounted(){
  const cards=[...$("list").querySelectorAll(".card")];
  if(cards.length && cards.every(c=>c._left()===0)) markDone();
}

function renderCards(){
  const list = $("list"); list.innerHTML=""; cardsByIdx = {};
  const sync = SYNC[fileKey()];
  let order;
  if(sync && sync.length){
    order=[]; for(const [,i] of sync) if(!order.includes(i)) order.push(i);   // the reciter's own order
    $("listNote").textContent = "النص يمشي مع صوت القارئ. اضغط على الذكر للعدّ، أو \"من هنا\" لتنتقل له.";
  } else {
    order = ADHKAR.map((d,i)=>i).filter(i=>{ const d=ADHKAR[i];
      return !d.syncOnly && !(period==="morning" && d.eOnly) && !(period==="evening" && d.mOnly); });
    $("listNote").textContent = "";
  }
  for(const i of order){
    const first = sync ? (sync.find(s=>s[1]===i)||[])[0] : null;
    const card = makeCard(ADHKAR[i], i, sync ? ()=>{ seekTo(first); } : null);
    cardsByIdx[i]=card; list.append(card);
  }
  const ex=$("extrasList"); ex.innerHTML="";
  EXTRAS.forEach((d,i)=>ex.append(makeCard(d,"x"+i,null)));
}

function seekTo(t){
  if(t==null) return;
  const go=()=>{ audio.currentTime=Math.max(0,t-0.3); if(audio.paused) play(); };
  if(audio.readyState>=1) go(); else { audio.addEventListener("loadedmetadata",go,{once:true}); play(); }
}

function highlight(){
  const sync = SYNC[fileKey()]; if(!sync) return;
  const t = audio.currentTime;
  let lo=0, hi=sync.length-1, k=-1;
  while(lo<=hi){ const mid=(lo+hi)>>1; if(sync[mid][0]<=t+0.2){ k=mid; lo=mid+1; } else hi=mid-1; }
  const idx = k>=0 ? sync[k][1] : null;
  if(idx===currentIdx) return;
  if(currentIdx!=null && cardsByIdx[currentIdx]) cardsByIdx[currentIdx].classList.remove("now");
  currentIdx = idx;
  const c = idx!=null ? cardsByIdx[idx] : null;
  if(c){
    c.classList.add("now");
    if(Date.now()-userScrolledAt > 5000 && !audio.paused){
      const top = c.getBoundingClientRect().top + window.scrollY - $("player").offsetHeight - 24;
      window.scrollTo({top, behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth"});
    }
  }
}
["touchmove","wheel"].forEach(ev=>window.addEventListener(ev,()=>{ userScrolledAt=Date.now(); },{passive:true}));

function render(){
  document.body.classList.toggle("evening", period==="evening");
  $("title").textContent = period==="morning" ? "أذكار الصباح" : "أذكار المساء";
  $("tab-morning").setAttribute("aria-pressed", period==="morning");
  $("tab-evening").setAttribute("aria-pressed", period==="evening");
  renderStatus();
}

function play(){
  audio.defaultPlaybackRate = audio.playbackRate = speed;
  $("status").textContent = "جاري التحميل…";
  audio.play().then(()=>{ started=true; $("status").textContent=""; })
    .catch(()=>{ $("status").textContent="اضغط ▶ أو في أي مكان لبدء الصوت"; });
}

$("play").addEventListener("click",()=>{ audio.paused ? play() : audio.pause(); });
audio.addEventListener("play",()=>{ $("play").textContent="❚❚"; $("play").setAttribute("aria-label","إيقاف مؤقت"); });
audio.addEventListener("pause",()=>{ $("play").textContent="▶"; $("play").setAttribute("aria-label","تشغيل");
  if(audio.currentTime>5 && audio.duration && audio.currentTime < audio.duration-5) store.set(posKey(), audio.currentTime.toFixed(1)); });
audio.addEventListener("ended",()=>{ $("status").textContent="تقبّل الله منك"; if(period===slot.period) markDone(); store.del(posKey()); });
audio.addEventListener("loadedmetadata",()=>{
  $("dur").textContent=fmt(audio.duration); audio.defaultPlaybackRate = audio.playbackRate = speed;
  if(resumeTo && resumeTo < audio.duration-10){
    audio.currentTime = Math.max(0, resumeTo-3);
    $("resume").hidden = false;
  }
  resumeTo = null;
});
let lastSave = 0;
audio.addEventListener("timeupdate",()=>{
  $("cur").textContent=fmt(audio.currentTime);
  if(audio.duration) $("fill").style.width=(audio.currentTime/audio.duration*100)+"%";
  highlight();
  const now=Date.now();
  if(now-lastSave>3000 && audio.currentTime>5){ lastSave=now; store.set(posKey(), audio.currentTime.toFixed(1)); }
  if(audio.duration && audio.currentTime > audio.duration-2 && period===slot.period) markDone();
});
audio.addEventListener("error",()=>{
  if(mirrorIdx < urls().length-1){
    mirrorIdx++;
    audio.src = urls()[mirrorIdx];
    audio.defaultPlaybackRate = audio.playbackRate = speed;
    play();
  } else {
    $("status").textContent="تعذّر تحميل الصوت. تأكد من الإنترنت أو جرّب قارئ ثاني.";
  }
});
audio.addEventListener("waiting",()=>{ $("status").textContent="جاري التحميل…"; });
audio.addEventListener("playing",()=>{ $("status").textContent=""; });
$("bar").addEventListener("click",e=>{
  if(!audio.duration) return;
  const r=e.currentTarget.getBoundingClientRect();
  const frac=(r.right-e.clientX)/r.width; // RTL: progress grows from the right
  audio.currentTime=Math.max(0,Math.min(1,frac))*audio.duration;
});
$("reciter").addEventListener("change",e=>{ reciter=e.target.value; store.set("reciter",reciter); $("resume").hidden=true; setSource(true); });
$("speed").addEventListener("change",e=>{ speed=parseFloat(e.target.value); store.set("speed2",speed); audio.defaultPlaybackRate = audio.playbackRate = speed; });
$("tab-morning").addEventListener("click",()=>{ if(period!=="morning"){ period="morning"; $("resume").hidden=true; render(); setSource(true);} });
$("tab-evening").addEventListener("click",()=>{ if(period!=="evening"){ period="evening"; $("resume").hidden=true; render(); setSource(true);} });
$("reset").addEventListener("click",()=>{ document.querySelectorAll(".card").forEach(c=>c._reset&&c._reset()); });
$("fromStart").addEventListener("click",()=>{ store.del(posKey()); audio.currentTime=0; $("resume").hidden=true; if(audio.paused) play(); });
$("again").addEventListener("click",()=>{ store.del(doneKey(slot.day,period)); renderStatus(); audio.currentTime=0; play(); });
$("locate").addEventListener("click",()=>{
  if(!navigator.geolocation){ $("times").textContent="تحديد الموقع غير متاح في هذا المتصفح"; return; }
  $("times").textContent="جاري تحديد موقعك…";
  navigator.geolocation.getCurrentPosition(p=>{
    city={name:"موقعك", lat:+p.coords.latitude.toFixed(3), lng:+p.coords.longitude.toFixed(3)};
    store.set("city", JSON.stringify(city)); slot=currentSlot(); renderStatus();
  }, ()=>{ renderStatus(); $("status").textContent="ما قدرت أحدد موقعك، أستخدم مواقيت "+city.name; }, {timeout:10000, maximumAge:86400000});
});

$("fill").style.marginRight="0"; $("bar").style.direction="rtl";

// Start right away. If the browser blocks sound until a tap, the first tap anywhere starts it.
let started = false;
audio.addEventListener("playing",()=>{ started = true; });
function firstTap(e){
  if(started) return;
  if(e.target.closest("#play,select,button")) return;
  started = true; play();
}
document.addEventListener("pointerdown", firstTap, {capture:true});
if("serviceWorker" in navigator){ navigator.serviceWorker.register("sw.js").catch(()=>{}); }

// Re-opened later (home-screen app): move to the right period if the time changed
document.addEventListener("visibilitychange",()=>{
  if(document.visibilityState!=="visible") return;
  const s=currentSlot();
  if((s.period!==slot.period || s.day!==slot.day) && audio.paused){ slot=s; period=s.period; render(); setSource(false); }
});

render(); setSource(false);
fetch("sync.json").then(r=>r.ok?r.json():{}).then(j=>{ SYNC=j||{}; renderCards(); highlight(); }).catch(()=>{});

// Autoplay unless this period is already done today
if(!isDone(slot.day, period)){
  audio.defaultPlaybackRate = audio.playbackRate = speed;
  audio.play().then(()=>{ started=true; }).catch(()=>{ $("status").textContent = "اضغط في أي مكان لبدء الصوت"; });
}
</script>
</body>
</html>
